<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leo Studio Login</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/studio.css" />
</head>
<body class="studio-body">
  <button type="button" class="icon-btn theme-toggle studio-login-theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <svg id="themeIconMoon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.8A9 9 0 1 1 9.2 3a7 7 0 1 0 11.8 11.8z" fill="currentColor"/></svg>
    <svg id="themeIconSun" viewBox="0 0 24 24" aria-hidden="true" style="display:none;"><path d="M12 4.5a1 1 0 0 1 1 1V7a1 1 0 1 1-2 0V5.5a1 1 0 0 1 1-1zm0 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7.5-4.5a1 1 0 1 1 0 2H18a1 1 0 1 1 0-2h1.5zM7 12a1 1 0 0 1-1 1H4.5a1 1 0 1 1 0-2H6a1 1 0 0 1 1 1zm9.19 5.78a1 1 0 0 1 1.42 0l1.06 1.06a1 1 0 1 1-1.41 1.41l-1.07-1.06a1 1 0 0 1 0-1.41zM6.74 6.74a1 1 0 0 1 1.41 0L9.2 7.8a1 1 0 0 1-1.41 1.4L6.74 8.16a1 1 0 0 1 0-1.42zm10.52 0a1 1 0 0 1 0 1.42L16.2 9.2a1 1 0 0 1-1.4-1.41l1.05-1.05a1 1 0 0 1 1.41 0zM7.8 14.8a1 1 0 0 1 1.4 1.4l-1.05 1.06a1 1 0 1 1-1.41-1.41L7.8 14.8z" fill="currentColor"/></svg>
  </button>
  <main class="studio-login-wrap">
    <section class="studio-login-card">
      <div class="logo-badge">LS</div>
      <h1>Studio Login</h1>
      <p>Authentication required to access Leo Studio dashboard.</p>

      {% if error %}
        <div class="status-box error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/studio/login" class="studio-form">
        <label>Username</label>
        <input type="text" name="username" placeholder="studio" required />
        <label>Password</label>
        <input type="password" name="password" placeholder="********" required />
        <button type="submit" class="primary-btn">Sign In</button>
      </form>
    </section>
  </main>
  <script>
    (function () {
      const body = document.body;
      const themeToggleBtn = document.getElementById('themeToggle');
      const moonIcon = document.getElementById('themeIconMoon');
      const sunIcon = document.getElementById('themeIconSun');
      const themeKey = 'leostudio.theme';

      function syncThemeIcon() {
        const dark = body.classList.contains('theme-dark');
        if (moonIcon) moonIcon.style.display = dark ? 'none' : 'block';
        if (sunIcon) sunIcon.style.display = dark ? 'block' : 'none';
      }

      if (localStorage.getItem(themeKey) === 'dark') {
        body.classList.add('theme-dark');
      }
      syncThemeIcon();

      if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', function () {
          body.classList.toggle('theme-dark');
          localStorage.setItem(themeKey, body.classList.contains('theme-dark') ? 'dark' : 'light');
          syncThemeIcon();
        });
      }
    })();
  </script>
</body>
</html>
